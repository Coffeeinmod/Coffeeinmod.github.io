<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoffeeinMod — GTA 5 singleplayer</title>
  <meta name="description" content="Fekete éjszaka. Narancs neon. Coffeein és GTA 5 mod — ScriptHook V, natív menü, singleplayer." />
  <meta name="theme-color" content="#070604" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="CoffeeinMod" />
  <meta property="og:description" content="Fekete éjszaka. Narancs neon. Los Santos, ahogy te akarod." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <header class="nav glass">
    <a class="brand" href="#top">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#070604"/><path d="M12 10.2c0-1.8 2-1.8 2-3.6" fill="none" stroke="#FFC14A" stroke-width="2" stroke-linecap="round"/><path d="M16.4 10.2c0-1.8 2-1.8 2-3.6" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round"/><rect x="7.5" y="13" width="14" height="13" rx="2.4" fill="#FF6A00"/><rect x="7.5" y="13" width="14" height="4.2" rx="2" fill="#FFC14A"/><path d="M21.5 16.4c2.7 0 4.2 1.3 4.2 3.4s-1.5 3.4-4.2 3.4" fill="none" stroke="#FF6A00" stroke-width="2.6" stroke-linecap="round"/></svg>
      CoffeeinMod
    </a>
    <nav class="links">
      <a href="#mods" data-i="nav.mods"></a>
      <a href="#install" data-i="nav.install"></a>
      <a href="#download" data-i="nav.download"></a>
      <a href="#community" data-i="nav.community"></a>
    </nav>
    <div class="lang">
      <button type="button" id="hu" class="on">HU</button>
      <button type="button" id="en">EN</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="wrap">
        <p class="kicker" data-i="hero.kicker"></p>
        <h1 class="display">COFFEEIN<span class="neon">MOD</span></h1>
        <p class="lead" data-i="hero.lead"></p>
        <div class="row">
          <button class="btn btn-primary" type="button" id="dl" data-i="hero.cta"></button>
          <a class="btn btn-glass" href="https://discord.gg/BYpNKz6KP" target="_blank" rel="noreferrer" data-i="hero.discord"></a>
          <a class="btn btn-outline" href="https://www.youtube.com/@c0ffeein" target="_blank" rel="noreferrer" data-i="hero.youtube"></a>
        </div>
      </div>
    </section>

    <section id="mods">
      <div class="wrap">
        <p class="kicker" data-i="mods.kicker"></p>
        <h2 class="display" data-i="mods.title"></h2>
        <p class="muted" data-i="mods.lead"></p>
        <div class="grid-2">
          <article class="glass">
            <div class="cap"></div>
            <div class="pad">
              <span class="tag" data-i="mods.coffeein.tag"></span>
              <h3 class="display" data-i="mods.coffeein.name"></h3>
              <p data-i="mods.coffeein.body"></p>
            </div>
          </article>
          <article class="glass">
            <div class="cap gta"></div>
            <div class="pad">
              <span class="tag" data-i="mods.gta.tag"></span>
              <h3 class="display" data-i="mods.gta.name"></h3>
              <p data-i="mods.gta.body"></p>
            </div>
          </article>
        </div>
        <p class="kicker" style="margin-top:4.5rem" data-i="features.kicker"></p>
        <h2 class="display" data-i="features.title"></h2>
        <div class="grid-3" id="features"></div>
      </div>
    </section>

    <section id="install">
      <div class="wrap">
        <p class="kicker" data-i="install.kicker"></p>
        <h2 class="display" data-i="install.title"></h2>
        <p class="muted" data-i="install.lead"></p>
        <div id="steps"></div>
        <p class="warn" data-i="install.note"></p>
      </div>
    </section>

    <section id="download">
      <div class="wrap">
        <div class="glass cta-block">
          <p class="kicker" data-i="download.kicker"></p>
          <h2 class="display" data-i="download.title"></h2>
          <p class="muted" data-i="download.body"></p>
          <div class="row">
            <button class="btn btn-primary" type="button" id="dl2" data-i="download.button"></button>
          </div>
          <p class="hint" data-i="download.hint"></p>
        </div>
      </div>
    </section>

    <section id="community">
      <div class="wrap">
        <p class="kicker" data-i="community.kicker"></p>
        <h2 class="display" data-i="community.title"></h2>
        <p class="muted" data-i="community.body"></p>
        <div class="grid-2">
          <a class="glass feat" href="https://discord.gg/BYpNKz6KP" target="_blank" rel="noreferrer">
            <h3 class="display" data-i="community.discord"></h3>
            <p>discord.gg/BYpNKz6KP</p>
          </a>
          <a class="glass feat" href="https://www.youtube.com/@c0ffeein" target="_blank" rel="noreferrer">
            <h3 class="display" data-i="community.youtube"></h3>
            <p>@c0ffeein</p>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p data-i="footer.unofficial"></p>
      <p style="margin-top:0.6rem">© <span id="y"></span> CoffeeinMod</p>
    </div>
  </footer>
  <div class="toast glass" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
